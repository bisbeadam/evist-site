<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eVist</title>
<meta name="description" content="Visor web d'àlbums de fotos .pholio">
<style>
  /* ---------- Tokens ---------- */
  :root {
    color-scheme: light dark;
    --accent: rgb(245,152,71);
    --on-accent: #1e1e1e;
    --bg: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --card: #f2f2f4;
    --line: #e3e3e6;
    --overlay: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e10; --fg: #f2f2f2; --muted: #9a9aa0; --card: #1c1c1f; --line: #2a2a2e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e10; --fg: #f2f2f2; --muted: #9a9aa0; --card: #1c1c1f; --line: #2a2a2e;
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 12px;
         background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
  .btn.ghost { background: var(--card); color: var(--fg); }
  .hidden { display: none !important; }

  /* ---------- Capçalera ---------- */
  header { padding: max(16px, env(safe-area-inset-top)) 16px 12px; display: flex; gap: 14px;
           align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0;
           background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px);
           z-index: 5; }
  header .titles { flex: 1; min-width: 0; }
  header h1 { font-size: 20px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header p  { margin: 2px 0 0; color: var(--muted); font-size: 14px; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  header .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); display: grid;
                 place-items: center; color: var(--on-accent); font-weight: 800; flex: none; }

  /* ---------- Graella ---------- */
  #grid { display: grid; gap: 3px; padding: 3px;
          grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  @media (min-width: 700px) { #grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px; padding: 4px; } }
  .cell { position: relative; aspect-ratio: 1; background: var(--card); overflow: hidden; border-radius: 4px; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .25s; }
  .cell img.ready { opacity: 1; }
  .cell .play { position: absolute; left: 8px; bottom: 8px; width: 26px; height: 26px; border-radius: 50%;
                background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; font-size: 12px; }
  .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* ---------- Estats ---------- */
  .state { min-height: 70vh; display: grid; place-items: center; padding: 24px; text-align: center; }
  .state .box { max-width: 460px; }
  .state h2 { margin: 0 0 8px; font-size: 22px; }
  .state p { margin: 0 0 18px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input[type=text] { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
                     background: var(--card); color: var(--fg); margin-bottom: 12px;
                     font-family: ui-monospace, Menlo, monospace; }
  .error { color: #d9534f; font-size: 14px; min-height: 20px; margin: -6px 0 10px; }
  .links { margin-top: 28px; font-size: 14px; color: var(--muted); }
  .links a { font-weight: 600; }

  /* ---------- Visor ---------- */
  #lightbox { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: flex; flex-direction: column;
              color: #fff; }
  #lb-top { display: flex; align-items: center; gap: 6px; padding: max(10px, env(safe-area-inset-top)) 10px 10px; }
  #lb-top .spacer { flex: 1; }
  #lb-top .count { font-size: 14px; opacity: .8; padding: 0 8px; }
  .icon { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
          background: rgba(255,255,255,.08); }
  .icon:hover { background: rgba(255,255,255,.16); }
  #lb-main { flex: 1; position: relative; display: flex; min-height: 0; }
  /* min-height: 0 perquè l'escenari pugui encongir-se dins del flex; i la
     imatge en posició absoluta, que és l'única manera que "100%" vulgui dir
     de debò l'alçada de l'escenari. Amb max-height: 100% a seques, una foto
     vertical creixia fins a la seva mida natural i quedava tallada. */
  #stage { flex: 1; display: grid; place-items: center; min-width: 0; min-height: 0; position: relative; touch-action: pan-y; overflow: hidden; }
  #stage img, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
                             user-select: none; -webkit-user-drag: none; }
  #stage .spinner { position: absolute; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 72px; display: grid;
         place-items: center; font-size: 28px; opacity: .55; }
  .nav:hover { opacity: 1; }
  .nav.prev { left: 4px; } .nav.next { right: 4px; }
  @media (hover: none) { .nav { display: none; } }
  #info { width: min(360px, 100%); background: rgba(20,20,22,.96); border-left: 1px solid rgba(255,255,255,.08);
          overflow: auto; padding: 16px; font-size: 14px; }
  @media (max-width: 700px) { #lb-main { flex-direction: column; } #info { width: 100%; max-height: 45%; border-left: 0; border-top: 1px solid rgba(255,255,255,.08); } }
  #info h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; margin: 14px 0 6px; }
  #info h3:first-child { margin-top: 0; }
  #info .row { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  #info .row span:first-child { width: 96px; flex: none; opacity: .6; }
  #info .row span:last-child { word-break: break-word; }
  #info a { color: var(--accent); }
  #lb-caption { padding: 6px 16px max(10px, env(safe-area-inset-bottom)); font-size: 13px; opacity: .7; text-align: center;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<header id="header" class="hidden">
  <div class="logo">eV</div>
  <div class="titles">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>
  <a id="open-app" class="btn ghost" href="#" data-i18n="openApp">Obrir amb eVist</a>
</header>

<div id="state" class="state"><div class="box">
  <div class="spinner"></div>
  <p data-i18n="loading">Carregant l'àlbum…</p>
</div></div>

<div id="grid" class="hidden" role="list"></div>

<div id="lightbox" class="hidden" role="dialog" aria-modal="true">
  <div id="lb-top">
    <button class="icon" id="lb-close" title="Tanca (Esc)">✕</button>
    <span class="spacer"></span>
    <span class="count" id="lb-count"></span>
    <button class="icon" id="lb-download" title="Baixa l'original">⤓</button>
    <button class="icon" id="lb-info" title="Informació (i)">ⓘ</button>
  </div>
  <div id="lb-main">
    <div id="stage">
      <button class="nav prev" id="lb-prev">‹</button>
      <button class="nav next" id="lb-next">›</button>
    </div>
    <aside id="info" class="hidden"></aside>
  </div>
  <div id="lb-caption"></div>
</div>

<script>
'use strict';

/* =====================================================================
   eVist — visor web de .pholio
   Una sola pàgina estàtica. Llegeix el fitxer a trossos (HTTP Range)
   d'allà on sigui — Dropbox, un servidor propi — exactament com fan les
   apps, i si l'àlbum té clau, la demana i desxifra al navegador amb
   WebCrypto. El fitxer no passa mai per cap servidor nostre.
   ===================================================================== */

/* ---------- Idioma (ca per defecte, en per a la resta) ---------- */
const STR = {
  ca: {
    loading: 'Carregant l’àlbum…', openApp: 'Obrir amb eVist', photos: 'fotos',
    noUrl: 'eVist', noUrlText: 'Àlbums de fotos .pholio. Aquesta pàgina s’obre amb l’enllaç d’un àlbum.',
    notPholio: 'Això no és un àlbum', notPholioText: 'L’enllaç no apunta a un fitxer .pholio, o el servidor en torna una pàgina web en lloc del fitxer.',
    corsFail: 'No s’ha pogut llegir l’àlbum', corsFailText: 'El servidor on és el fitxer no permet que un navegador el llegeixi (CORS). L’app eVist sí que el pot obrir.',
    noRange: 'Servidor incompatible', noRangeText: 'Aquest servidor no admet llegir el fitxer a trossos (HTTP Range), i el visor ho necessita.',
    locked: 'Àlbum protegit', lockedText: 'Enganxa aquí el token d’accés que t’hagi passat qui el comparteix.',
    tokenPlaceholder: 'token', unlock: 'Desbloqueja', badToken: 'Token incorrecte.',
    noApp: 'No tens eVist?', android: 'Baixa’l per a Android', iosSoon: 'Per a iPhone, aviat a l’App Store.',
    photo: 'Foto', video: 'Vídeo', general: 'General', camera: 'Càmera', location: 'Ubicació',
    type: 'Tipus', dims: 'Dimensions', date: 'Data', duration: 'Durada', file: 'Fitxer',
    make: 'Marca', model: 'Model', lens: 'Objectiu', focal: 'Focal', aperture: 'Obertura', shutter: 'Obturació', iso: 'ISO', flash: 'Flaix',
    yes: 'Sí', no: 'No', city: 'Ciutat', country: 'País', coords: 'Coordenades', openMaps: 'Obre a Mapes', openGoogle: 'Obre a Google Maps',
    loadFail: 'No s’ha pogut carregar aquest element.'
  },
  en: {
    loading: 'Loading album…', openApp: 'Open in eVist', photos: 'photos',
    noUrl: 'eVist', noUrlText: '.pholio photo albums. This page opens from an album link.',
    notPholio: 'This is not an album', notPholioText: 'The link does not point to a .pholio file, or the server returns a web page instead of the file.',
    corsFail: 'Could not read the album', corsFailText: 'The server hosting the file does not allow a browser to read it (CORS). The eVist app can still open it.',
    noRange: 'Incompatible server', noRangeText: 'This server does not support reading the file in parts (HTTP Range), which the viewer needs.',
    locked: 'Protected album', lockedText: 'Paste the access token you were given by whoever shared it.',
    tokenPlaceholder: 'token', unlock: 'Unlock', badToken: 'Wrong token.',
    noApp: 'Don’t have eVist?', android: 'Download for Android', iosSoon: 'For iPhone, coming soon to the App Store.',
    photo: 'Photo', video: 'Video', general: 'General', camera: 'Camera', location: 'Location',
    type: 'Type', dims: 'Dimensions', date: 'Date', duration: 'Duration', file: 'File',
    make: 'Make', model: 'Model', lens: 'Lens', focal: 'Focal length', aperture: 'Aperture', shutter: 'Shutter', iso: 'ISO', flash: 'Flash',
    yes: 'Yes', no: 'No', city: 'City', country: 'Country', coords: 'Coordinates', openMaps: 'Open in Maps', openGoogle: 'Open in Google Maps',
    loadFail: 'Could not load this item.'
  }
};
const LANG = (navigator.language || 'en').toLowerCase().startsWith('ca') ? 'ca' : 'en';
const t = k => (STR[LANG][k] ?? STR.en[k] ?? k);
document.documentElement.lang = LANG;
document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));

const ANDROID_APK = 'https://github.com/bisbeadam/evist-site/releases/latest/download/eVist.apk';
const $ = id => document.getElementById(id);
const enc = new TextEncoder();

/* ---------- URL de l'àlbum ---------- */
/// Un enllaç compartit de Dropbox (www.dropbox.com, dl=0) serveix una
/// pàgina web. Amb dl=1 serveix els bytes, però a través d'una redirecció
/// cap a un host de descàrrega que el navegador no pot seguir en mode CORS.
/// El host dl.dropboxusercontent.com serveix el mateix fitxer DIRECTAMENT,
/// sense redirecció, amb Range i amb les capçaleres CORS: és el que fem servir.
function normalizeRemoteURL(raw) {
  let u; try { u = new URL(raw); } catch { return raw; }
  const h = u.hostname.toLowerCase();
  if (h !== 'www.dropbox.com' && h !== 'dropbox.com' && h !== 'dl.dropboxusercontent.com') return raw;
  u.hostname = 'dl.dropboxusercontent.com';
  u.searchParams.delete('dl'); u.searchParams.delete('raw');
  u.searchParams.set('dl', '1');
  return u.toString();
}

/* ---------- Lectura per trossos ---------- */
/// Màxim de peticions en vol alhora: igual que a les apps, perquè una
/// graella no obri desenes de connexions de cop.
const gate = (() => { let active = 0, q = []; const LIMIT = 4;
  return { async acquire() { if (active < LIMIT) { active++; return; } await new Promise(r => q.push(r)); },
           release() { if (q.length) q.shift()(); else active--; } }; })();

class PholioError extends Error { constructor(kind, msg) { super(msg || kind); this.kind = kind; } }

async function readRange(url, offset, length) {
  await gate.acquire();
  try {
    let res;
    try {
      res = await fetch(url, { headers: { Range: `bytes=${offset}-${offset + length - 1}` } });
    } catch (e) {
      // Un TypeError aquí és gairebé sempre CORS (el navegador no deixa ni veure la resposta).
      throw new PholioError('cors', e.message);
    }
    const ct = (res.headers.get('content-type') || '').toLowerCase();
    if (ct.includes('text/html')) throw new PholioError('notPholio');
    if (res.status === 206) return new Uint8Array(await res.arrayBuffer());
    if (res.status === 200) {
      // El servidor ha ignorat el Range. Si el fitxer és petit, encara ho podem
      // salvar; si no, abortem abans de baixar-ho tot.
      const total = parseInt(res.headers.get('content-length') || '0', 10);
      if (total && total <= Math.max(length * 4, 1 << 20)) {
        const all = new Uint8Array(await res.arrayBuffer());
        return all.slice(offset, offset + length);
      }
      try { res.body?.cancel(); } catch {}
      throw new PholioError('noRange');
    }
    throw new PholioError('http', `HTTP ${res.status}`);
  } finally { gate.release(); }
}

/* ---------- Criptografia (ha de coincidir bit a bit amb PholioCrypto.swift) ---------- */
async function sha256hex(s) {
  const d = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(s)));
  return [...d].map(b => b.toString(16).padStart(2, '0')).join('');
}
/// HKDF-SHA256 amb sal "pholio-v1" i info "asset-encryption", 32 bytes → AES-256.
async function deriveKey(token) {
  const ikm = await crypto.subtle.importKey('raw', enc.encode(token), 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: enc.encode('pholio-v1'), info: enc.encode('asset-encryption') },
    ikm, { name: 'AES-CTR', length: 256 }, false, ['decrypt']);
}
function hexToBytes(hex) {
  if (!hex || hex.length !== 32) return null;
  const out = new Uint8Array(16);
  for (let i = 0; i < 16; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
/// AES-CTR: el nonce de 16 bytes és el bloc de comptador inicial, i el
/// comptador avança en big-endian sobre els 128 bits (kCCModeOptionCTR_BE).
/// Llegim cada sub-fitxer sencer des de l'inici, així que no cal cap offset.
async function decrypt(key, nonceHex, data) {
  const counter = hexToBytes(nonceHex);
  if (!counter) throw new PholioError('nonce');
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CTR', counter, length: 128 }, key, data));
}

/* ---------- El fitxer ---------- */
class PholioFile {
  constructor(url, meta) { this.url = url; this.meta = meta; this.key = null; }

  static async open(url) {
    const head = await readRange(url, 0, 8);
    if (String.fromCharCode(...head.slice(0, 4)) !== 'PHLO') throw new PholioError('notPholio');
    const jsonSize = new DataView(head.buffer).getUint32(4, false);
    const jsonBytes = await readRange(url, 8, jsonSize);
    const meta = JSON.parse(new TextDecoder().decode(jsonBytes));
    return new PholioFile(url, meta);
  }

  get isEncrypted() { return !!this.meta.encrypted; }
  get needsToken() { return !!(this.meta.passwordHash && this.meta.passwordHash.length); }

  async unlock(token) {
    if ((await sha256hex(token)) !== this.meta.passwordHash) return false;
    if (this.isEncrypted) this.key = await deriveKey(token);
    return true;
  }

  /// Mida per a la pantalla gran. "xlarge" (3840) només si la pantalla ho
  /// aprofita; si no, "large" (2048), que és més lleuger.
  bestDisplaySize(asset) {
    const px = Math.max(innerWidth, innerHeight) * (devicePixelRatio || 1);
    if (px > 2200 && asset.offsets?.xlarge != null && asset.sizes?.xlarge != null) return 'xlarge';
    if (asset.offsets?.large != null && asset.sizes?.large != null) return 'large';
    if (asset.offsets?.medium != null && asset.sizes?.medium != null) return 'medium';
    return 'original';
  }

  async load(asset, size) {
    const off = asset.offsets?.[size], len = asset.sizes?.[size];
    if (off == null || len == null) throw new PholioError('missing', size);
    let data = await readRange(this.url, off, len);
    if (this.isEncrypted) {
      if (!this.key) throw new PholioError('locked');
      data = await decrypt(this.key, asset.nonces?.[size], data);
    }
    return data;
  }
}

/* ---------- UI: estats ---------- */
function showState(html) { $('state').innerHTML = `<div class="box">${html}</div>`; $('state').classList.remove('hidden'); }
function hideState() { $('state').classList.add('hidden'); }
function appLinks(albumURL) {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  return `<p class="links">${t('noApp')} <a href="${ANDROID_APK}">${t('android')}</a>.${ios ? ' ' + t('iosSoon') : ''}</p>`;
}
function fail(kind, albumURL) {
  const map = { notPholio: ['notPholio', 'notPholioText'], cors: ['corsFail', 'corsFailText'], noRange: ['noRange', 'noRangeText'] };
  const [h, p] = map[kind] || ['notPholio', 'notPholioText'];
  showState(`<h2>${t(h)}</h2><p>${t(p)}</p>
    ${albumURL ? `<a class="btn" href="pholio://open?url=${encodeURIComponent(albumURL)}">${t('openApp')}</a>` : ''}
    ${appLinks(albumURL)}`);
}

async function askToken(file) {
  return new Promise(resolve => {
    showState(`<h2>${t('locked')}</h2><p>${t('lockedText')}</p>
      <input type="text" id="token" placeholder="${t('tokenPlaceholder')}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="error" id="token-err"></div>
      <button class="btn" id="token-go">${t('unlock')}</button>`);
    const input = $('token'), go = $('token-go'), err = $('token-err');
    const tryIt = async () => {
      const v = input.value.trim(); if (!v) return;
      go.disabled = true;
      if (await file.unlock(v)) resolve(true);
      else { err.textContent = t('badToken'); input.select(); go.disabled = false; }
    };
    go.onclick = tryIt; input.onkeydown = e => { if (e.key === 'Enter') tryIt(); };
    input.focus();
  });
}

/* ---------- UI: graella ---------- */
const blobURLs = new Map();   // asset.index → object URL de la miniatura
function toBlobURL(bytes, type) { return URL.createObjectURL(new Blob([bytes], { type })); }
function mimeFor(asset, size) {
  if (asset.type === 'video' && size === 'original') return 'video/mp4';
  if (size === 'original') { const f = (asset.originalFormat || '').toLowerCase();
    if (f === 'tiff' || f === 'tif') return 'image/tiff'; if (f === 'png') return 'image/png'; if (f === 'heic') return 'image/heic'; }
  return 'image/jpeg';
}

function buildGrid(file) {
  const grid = $('grid'); grid.innerHTML = '';
  const io = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) { io.unobserve(e.target); loadThumb(file, e.target); }
  }, { rootMargin: '300px' });

  file.meta.assets.forEach((asset, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell'; cell.tabIndex = 0; cell.dataset.i = i; cell.setAttribute('role', 'listitem');
    cell.innerHTML = `<img alt="">${asset.type === 'video' ? '<span class="play">▶</span>' : ''}`;
    cell.onclick = () => openLightbox(file, i);
    cell.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(file, i); } };
    grid.appendChild(cell); io.observe(cell);
  });
  grid.classList.remove('hidden');
}

async function loadThumb(file, cell) {
  const asset = file.meta.assets[+cell.dataset.i];
  try {
    const bytes = await file.load(asset, 'thumb');
    const url = toBlobURL(bytes, 'image/jpeg'); blobURLs.set(asset.index, url);
    const img = cell.querySelector('img'); img.onload = () => img.classList.add('ready'); img.src = url;
  } catch (e) { cell.style.opacity = .35; }
}

/* ---------- UI: visor ---------- */
let LB = { file: null, i: 0, url: null, open: false };

function openLightbox(file, i) {
  LB.file = file; LB.open = true;
  $('lightbox').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  show(i);
}
function closeLightbox() {
  LB.open = false; $('lightbox').classList.add('hidden'); document.body.style.overflow = '';
  clearStage(); $('info').classList.add('hidden');
  const cell = document.querySelector(`.cell[data-i="${LB.i}"]`); cell?.focus({ preventScroll: false });
  cell?.scrollIntoView({ block: 'nearest' });
}
function clearStage() {
  const stage = $('stage');
  stage.querySelectorAll('img, video, .spinner, .msg').forEach(n => { if (n.tagName === 'VIDEO') { n.pause(); n.removeAttribute('src'); n.load(); } n.remove(); });
  if (LB.url) { URL.revokeObjectURL(LB.url); LB.url = null; }
}
async function show(i) {
  const file = LB.file, assets = file.meta.assets;
  LB.i = (i + assets.length) % assets.length;
  const asset = assets[LB.i];
  clearStage();
  $('lb-count').textContent = `${LB.i + 1} / ${assets.length}`;
  $('lb-caption').textContent = asset.filename || '';
  renderInfo(asset);
  const stage = $('stage'); const sp = document.createElement('div'); sp.className = 'spinner'; stage.appendChild(sp);
  const my = LB.i;
  try {
    const size = asset.type === 'video' ? 'original' : file.bestDisplaySize(asset);
    const bytes = await file.load(asset, size);
    if (LB.i !== my || !LB.open) return;
    LB.url = toBlobURL(bytes, mimeFor(asset, size));
    const el = document.createElement(asset.type === 'video' ? 'video' : 'img');
    if (asset.type === 'video') { el.controls = true; el.autoplay = true; el.playsInline = true; }
    el.src = LB.url; sp.remove(); stage.appendChild(el);
    preload(file, LB.i + 1);
  } catch (e) {
    if (LB.i !== my) return;
    sp.remove(); const m = document.createElement('div'); m.className = 'msg'; m.textContent = t('loadFail'); stage.appendChild(m);
  }
}
/// Precàrrega la següent foto perquè la fletxa sigui instantània.
const preloaded = new Map();
async function preload(file, i) {
  const assets = file.meta.assets; i = (i + assets.length) % assets.length;
  const a = assets[i]; if (a.type === 'video' || preloaded.has(i)) return;
  preloaded.set(i, true);
  try { await file.load(a, file.bestDisplaySize(a)); } catch {}
  // No guardem els bytes: el navegador ja té la resposta a la memòria cau HTTP.
}

async function downloadOriginal() {
  const file = LB.file, asset = file.meta.assets[LB.i];
  const btn = $('lb-download'); btn.disabled = true; btn.style.opacity = .5;
  try {
    const bytes = await file.load(asset, 'original');
    const url = toBlobURL(bytes, mimeFor(asset, 'original'));
    const a = document.createElement('a'); a.href = url; a.download = asset.filename || `photo-${asset.index}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60_000);
  } catch {} finally { btn.disabled = false; btn.style.opacity = ''; }
}

function renderInfo(asset) {
  const row = (k, v) => v == null || v === '' ? '' : `<div class="row"><span>${t(k)}</span><span>${v}</span></div>`;
  const ex = asset.exif || {};
  let html = `<h3>${t('general')}</h3>`
    + row('type', asset.type === 'video' ? t('video') : t('photo'))
    + row('dims', asset.width && asset.height ? `${asset.width} × ${asset.height}` : null)
    + row('duration', asset.duration ? `${asset.duration.toFixed(1)} s` : null)
    + row('date', fmtDate(asset.date))
    + row('file', asset.filename);
  const cam = row('make', ex.cameraMake) + row('model', ex.cameraModel) + row('lens', ex.lens)
    + row('focal', ex.focalLength ? `${ex.focalLength} mm` : null)
    + row('aperture', ex.aperture ? `f/${ex.aperture}` : null)
    + row('shutter', ex.shutterSpeed) + row('iso', ex.iso)
    + row('flash', ex.flash == null ? null : (ex.flash ? t('yes') : t('no')));
  if (cam) html += `<h3>${t('camera')}</h3>${cam}`;
  const loc = ex.location;
  if (loc && loc.latitude != null && loc.longitude != null) {
    const lat = loc.latitude, lon = loc.longitude;
    html += `<h3>${t('location')}</h3>`
      + row('city', ex.city || loc.city) + row('country', ex.country || loc.country)
      + row('coords', `${lat.toFixed(5)}, ${lon.toFixed(5)}`)
      + `<div class="row"><span></span><span>
           <a href="https://maps.apple.com/?ll=${lat},${lon}&q=${encodeURIComponent(asset.filename || 'Photo')}" target="_blank" rel="noopener">${t('openMaps')}</a> ·
           <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" rel="noopener">${t('openGoogle')}</a>
         </span></div>`;
  }
  $('info').innerHTML = html;
}
function fmtDate(iso) {
  if (!iso) return null; const d = new Date(iso); if (isNaN(d)) return iso;
  return d.toLocaleString(LANG === 'ca' ? 'ca-ES' : undefined, { dateStyle: 'long', timeStyle: 'short' });
}

/* ---------- Controls ---------- */
$('lb-close').onclick = closeLightbox;
$('lb-prev').onclick = () => show(LB.i - 1);
$('lb-next').onclick = () => show(LB.i + 1);
$('lb-info').onclick = () => $('info').classList.toggle('hidden');
$('lb-download').onclick = downloadOriginal;
document.addEventListener('keydown', e => {
  if (!LB.open) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); show(LB.i + 1); }
  else if (e.key === 'ArrowLeft') show(LB.i - 1);
  else if (e.key === 'i' || e.key === 'I') $('info').classList.toggle('hidden');
});
// Lliscar amb el dit
(() => { let x0 = null, y0 = null; const st = $('stage');
  st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  st.addEventListener('touchend', e => {
    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(LB.i + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();

/* ---------- Arrencada ---------- */
(async function main() {
  // Tolerem un interrogant de més (open??url=...), que és fàcil de teclejar a mà.
  const params = new URLSearchParams(location.search);
  const raw = params.get('url') ?? params.get('?url');
  if (!raw) { showState(`<h2>${t('noUrl')}</h2><p>${t('noUrlText')}</p>${appLinks('')}`); return; }
  const url = normalizeRemoteURL(raw.trim());
  $('open-app').href = 'pholio://open?url=' + encodeURIComponent(raw.trim());

  let file;
  try { file = await PholioFile.open(url); }
  catch (e) { fail(e.kind, raw); return; }

  if (file.needsToken) {
    // Recordem el token d'aquest àlbum en aquest navegador, i prou.
    const k = 'pholio-token:' + await sha256hex(url); let saved = null;
    try { saved = sessionStorage.getItem(k); } catch {}
    if (!(saved && await file.unlock(saved))) { await askToken(file); try { sessionStorage.setItem(k, $('token').value.trim()); } catch {} }
  }

  $('title').textContent = file.meta.title || '';
  $('subtitle').textContent = [file.meta.subtitle, `${file.meta.assets.length} ${t('photos')}`].filter(Boolean).join(' · ');
  document.title = (file.meta.title ? file.meta.title + ' — ' : '') + 'eVist';
  $('header').classList.remove('hidden');
  hideState();
  buildGrid(file);
})();
</script>
